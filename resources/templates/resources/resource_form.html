{% extends "base.html" %}
{% block title %}{{ page_title }} | AI Study Hub{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-4"> {{ page_title }} </h2>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold"> Title </label>
                            {{ form.title }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold"> Description </label>
                            {{ form.description }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">  Resource Link </label>
                            {{ form.link }}
                        </div>
                        <div class="mb-4"> <label class="form-label fw-semibold"> Resource Type</label>
                            {{ form.resource_type }}
                        </div>
                        <button type="submit" class="btn btn-primary"> <i class="bi bi-check-lg"></i> {{ button_text }} </button>
                        <a  href="{% url 'resources_list' %}" class="btn btn-light"> Cancel </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
