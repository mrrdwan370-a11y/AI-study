<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Password | AI Study Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top right,
                    #7c3aed,
                    transparent 30%
                ),
                #070914;

        }

        .box {

            width: 100%;

            max-width: 500px;

            margin: 20px;

            padding: 45px;

            border-radius: 25px;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid rgba(255,255,255,.12);

            backdrop-filter: blur(20px);

        }

        h1 {

            text-align: center;

            font-size: 28px;

            margin-bottom: 10px;

        }

        .description {

            text-align: center;

            color: #aab1c3;

            margin-bottom: 30px;

            line-height: 1.6;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            font-size: 13px;

        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 18px;

            border-radius: 11px;

            border:
                1px solid rgba(255,255,255,.12);

            background:
                rgba(255,255,255,.05);

            color: white;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 11px;

            color: white;

            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

        }

        .errorlist {

            color: #f87171;

            list-style: none;

            padding: 0;

            font-size: 12px;

        }

    </style>

</head>


<body>

<div class="box">

    {% if validlink %}

        <h1>
            Create New Password 🔐
        </h1>

        <p class="description">

            Enter your new password below.

        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">

                Change Password

            </button>

        </form>

    {% else %}

        <h1>
            Invalid Link ❌
        </h1>

        <p class="description">

            This password reset link is invalid
            or has already been used.

        </p>

        <a href="{% url 'password_reset' %}">
            Request a new link
        </a>

    {% endif %}

</div>

</body>

</html>
