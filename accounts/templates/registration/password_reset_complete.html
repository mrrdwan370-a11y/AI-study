<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Changed | AI Study Hub</title>

    <style>

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #4338ca,
                    transparent 35%
                ),
                #070914;

        }

        .box {

            max-width: 500px;

            margin: 20px;

            padding: 50px;

            text-align: center;

            border-radius: 25px;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid rgba(255,255,255,.12);

        }

        .icon {

            font-size: 60px;

            margin-bottom: 20px;

        }

        h1 {

            font-size: 28px;

        }

        p {

            color: #aab1c3;

            line-height: 1.7;

        }

        a {

            display: inline-block;

            margin-top: 20px;

            padding: 13px 25px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            text-decoration: none;

        }

    </style>

</head>


<body>

<div class="box">

    <div class="icon">
        ✅
    </div>

    <h1>
        Password Changed!
    </h1>

    <p>

        Your password has been successfully
        updated.

        You can now login to your AI Study Hub
        account using your new password.

    </p>

    <a href="{% url 'login' %}">
        Login Now →
    </a>

</div>

</body>

</html>
