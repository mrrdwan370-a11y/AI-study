<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Sent | AI Study Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top left,
                    #4f46e5,
                    transparent 30%
                ),
                #070914;

        }

        .box {

            max-width: 500px;

            margin: 20px;

            padding: 50px;

            text-align: center;

            border-radius: 25px;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid rgba(255,255,255,.12);

            backdrop-filter: blur(20px);

        }

        .icon {

            font-size: 55px;

            margin-bottom: 20px;

        }

        h1 {

            font-size: 28px;

            margin-bottom: 15px;

        }

        p {

            color: #aab1c3;

            line-height: 1.7;

        }

        a {

            display: inline-block;

            margin-top: 25px;

            padding: 13px 25px;

            border-radius: 10px;

            color: white;

            text-decoration: none;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

        }

    </style>

</head>


<body>

<div class="box">

    <div class="icon">
        📧
    </div>

    <h1>
        Check Your Email
    </h1>

    <p>

        We've sent password reset instructions
        to your email address.

        Please check your inbox and follow
        the link to create a new password.

    </p>

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</div>

</body>

</html>
