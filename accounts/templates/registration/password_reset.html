{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | AI Study Hub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Inter', sans-serif;

            color: white;

            background:

                radial-gradient(
                    circle at 10% 20%,
                    rgba(99,102,241,.25),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(168,85,247,.20),
                    transparent 30%
                ),

                #070914;

        }

        .container-box {

            width: 100%;
            max-width: 500px;

            margin: 20px;

            padding: 45px;

            border-radius: 25px;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid rgba(255,255,255,.10);

            backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0,0,0,.5);

        }

        .icon {

            width: 70px;
            height: 70px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 25px;

            border-radius: 20px;

            font-size: 32px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

        }

        h1 {

            text-align: center;

            font-size: 28px;

            font-weight: 800;

            margin-bottom: 10px;

        }

        .description {

            text-align: center;

            color: #9299ad;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 30px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #d9ddea;

        }

        input {

            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,.12);

            background:
                rgba(255,255,255,.05);

            color: white;

            outline: none;

        }

        input:focus {

            border-color: #818cf8;

            box-shadow:
                0 0 0 4px
                rgba(99,102,241,.10);

        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;

            border-radius: 12px;

            color: white;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            cursor: pointer;

            transition: .3s;

        }

        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 15px 30px
                rgba(99,102,241,.3);

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 25px;

            color: #a5b4fc;

            text-decoration: none;

            font-size: 13px;

        }

        .errorlist {

            color: #f87171;

            list-style: none;

            padding: 0;

            margin-top: 7px;

            font-size: 12px;

        }

    </style>

</head>


<body>

<div class="container-box">

    <div class="icon">
        🔐
    </div>

    <h1>
        Forgot Password?
    </h1>

    <p class="description">

        No worries! Enter the email address
        associated with your AI Study Hub account
        and we'll send you a password reset link.

    </p>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">

            Send Reset Link →

        </button>

    </form>


    <a
        href="{% url 'login' %}"
        class="back">

        ← Back to Login

    </a>

</div>

</body>

</html>
