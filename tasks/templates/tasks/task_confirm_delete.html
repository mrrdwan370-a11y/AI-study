{% extends "base.html" %}
{% block title %}Delete Task | AI Study Hub{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center p-5">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
                    <h3 class="fw-bold mt-3"> Delete Task? </h3>
                    <p class="text-muted"> Are you sure you want to delete <strong>{{ task.title }}</strong>? </p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-danger"> Yes, Delete </button>
                            <a  href="{% url 'tasks_list' %}"  class="btn btn-light"> Cancel </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
